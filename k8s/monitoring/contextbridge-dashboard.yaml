apiVersion: v1
kind: ConfigMap
metadata:
  name: contextbridge-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  contextbridge.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {
              "expr": "sum by (method, path, status) (rate(contextbridge_http_requests_total[5m]))",
              "legendFormat": "{{method}} {{path}} {{status}}",
              "refId": "A"
            }
          ],
          "title": "Request rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, method, path) (rate(contextbridge_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{method}} {{path}}",
              "refId": "A"
            }
          ],
          "title": "95th percentile request duration",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "id": 3,
          "options": {"legend": {"displayMode": "table", "placement": "right"}},
          "targets": [
            {
              "expr": "up{namespace=\"contextbridge\", service=\"contextbridge-api\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "ContextBridge scrape targets",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 42,
      "tags": ["contextbridge", "learning"],
      "templating": {"list": []},
      "time": {"from": "now-30m", "to": "now"},
      "title": "ContextBridge API",
      "uid": "contextbridge-api",
      "version": 1
    }
